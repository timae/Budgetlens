# Deploio defaults for Budget Lens. Settings changed in Cockpit or with nctl take precedence.
# Field reference: https://guides.deplo.io/user-guide/configuring-your-application.html
size: micro
port: 8080
replicas: 1
# No login in front of the app. Files never leave the browser, so the server holds no data.
# To require a login again: set this to true (credentials: nctl get app budget-lens --basic-auth-credentials).
enableBasicAuth: false
# HTTP health check. The server answers GET/HEAD /healthz with 200 "ok".
healthProbe:
  path: /healthz
  periodSeconds: 10
